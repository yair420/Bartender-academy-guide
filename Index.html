<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אקדמיית הבר · קורס ברמנים בינלאומי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Heebo:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0B0D;
  --bg-deep:#060608;
  --surface:#17171C;
  --surface-2:#33241615;
  --line:rgba(127,229,143,.16);
  --amber:#7FE58F;
  --amber-deep:#3FAE5F;
  --copper:#3FA968;
  --cream:#F5F4F2;
  --muted:#A5A19A;
  --green:#5CC98A;
  --red:#D9705E;
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
body{
  font-family:'Heebo','Inter',sans-serif;
  background:
    radial-gradient(1200px 500px at 50% -10%, rgba(127,229,143,.08), transparent 60%),
    var(--bg);
  color:var(--cream);
  min-height:100vh;
  line-height:1.7;
}
.wrap{max-width:680px;margin:0 auto;padding:0 18px 90px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  background:rgba(8,8,10,.85);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:680px;margin:0 auto;padding:12px 18px;
  display:flex;align-items:center;gap:12px;
}
.brand{
  font-family:'Inter','Heebo',sans-serif;font-weight:900;font-size:1.05rem;
  color:var(--amber);letter-spacing:.02em;cursor:pointer;
}
.brand small{display:block;font-family:'Heebo';font-weight:300;font-size:.68rem;color:var(--muted);letter-spacing:.14em}
.back-btn{
  margin-inline-start:auto;
  background:none;border:1px solid var(--line);color:var(--cream);
  border-radius:999px;padding:6px 16px;font-family:'Heebo';font-size:.85rem;
  cursor:pointer;display:none;
}
.back-btn:hover,.back-btn:focus-visible{border-color:var(--amber);color:var(--amber)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ---------- screens ---------- */
.screen{display:none;animation:fadeIn .35s ease}
.screen.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- dashboard hero ---------- */
.hero{padding:34px 0 10px;text-align:center}
.hero .eyebrow{
  font-size:.72rem;letter-spacing:.28em;color:var(--muted);
  text-transform:uppercase;margin-bottom:10px;
}
.hero h1{
  font-family:'Inter','Heebo',sans-serif;font-weight:900;
  font-size:clamp(1.9rem,7vw,2.6rem);line-height:1.25;color:var(--cream);
}
.hero h1 em{font-style:normal;color:var(--amber)}
.hero p{color:var(--muted);font-weight:300;margin-top:8px;font-size:.95rem}

.progress-strip{
  margin:22px 0 8px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:16px 18px;
  display:flex;align-items:center;gap:16px;
}
.progress-strip .pct{
  font-family:'Inter','Heebo',sans-serif;font-weight:900;font-size:1.7rem;color:var(--amber);
  min-width:64px;text-align:center;
}
.progress-strip .bar-wrap{flex:1}
.progress-strip .bar-label{font-size:.78rem;color:var(--muted);margin-bottom:6px}
.bar{height:8px;background:var(--bg-deep);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber-deep),var(--amber));border-radius:99px;transition:width .6s ease}

.continue-btn{
  display:block;width:100%;margin:14px 0 4px;
  background:linear-gradient(180deg,var(--amber),var(--amber-deep));
  color:#0A1A0F;border:none;border-radius:var(--radius);
  font-family:'Heebo';font-weight:700;font-size:1rem;padding:14px;cursor:pointer;
}
.continue-btn:hover{filter:brightness(1.06)}

/* ---------- the backbar shelf (signature) ---------- */
.shelf-title{
  font-family:'Inter','Heebo',sans-serif;font-weight:700;font-size:1.15rem;
  margin:30px 0 4px;color:var(--cream);
}
.shelf-sub{font-size:.82rem;color:var(--muted);margin-bottom:16px}
.shelf{
  position:relative;
  display:grid;grid-template-columns:repeat(5,1fr);gap:10px;
  align-items:end;
  padding:18px 14px 0;
  background:linear-gradient(180deg,transparent 55%, rgba(127,229,143,.06));
  border-bottom:6px solid #3A2A1A;
  border-radius:4px;
}
.bottle-slot{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:none;cursor:pointer;padding:0 0 10px;color:inherit;font-family:inherit}
.bottle{
  --fill:0%;
  position:relative;width:min(46px,100%);height:110px;
}
.bottle .neck{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:14px;height:30px;background:rgba(243,233,214,.10);
  border:1px solid var(--line);border-bottom:none;border-radius:5px 5px 0 0;
}
.bottle .body{
  position:absolute;bottom:0;left:0;right:0;height:84px;
  background:rgba(243,233,214,.06);
  border:1px solid var(--line);border-radius:9px 9px 12px 12px;
  overflow:hidden;
}
.bottle .liquid{
  position:absolute;bottom:0;left:0;right:0;height:var(--fill);
  background:linear-gradient(180deg,var(--amber) , var(--amber-deep));
  opacity:.92;transition:height .8s ease;
}
.bottle .body::after{ /* glass shine */
  content:"";position:absolute;top:6px;right:6px;width:5px;height:70%;
  background:rgba(255,255,255,.10);border-radius:99px;
}
.bottle.locked .liquid{background:#4a3b2b;opacity:.5}
.bottle .lock{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;color:var(--muted);
}
.bottle-slot .b-name{font-size:.72rem;color:var(--cream);line-height:1.3;text-align:center;font-weight:500}
.bottle-slot .b-pct{font-size:.68rem;color:var(--muted)}
.bottle-slot:hover .b-name,.bottle-slot:focus-visible .b-name{color:var(--amber)}
@media (max-width:430px){
  .shelf{grid-template-columns:repeat(5,1fr);gap:6px}
  .bottle{height:96px}.bottle .body{height:72px}
}

.sim-card{
  margin-top:26px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:18px;
  display:flex;align-items:center;gap:14px;
}
.sim-card .icon{font-size:1.9rem}
.sim-card h3{font-family:'Inter','Heebo',sans-serif;font-size:1.05rem;color:var(--amber)}
.sim-card p{font-size:.83rem;color:var(--muted)}
.sim-card button{
  margin-inline-start:auto;background:none;border:1px solid var(--amber);color:var(--amber);
  border-radius:999px;padding:8px 18px;font-family:'Heebo';font-weight:500;cursor:pointer;white-space:nowrap;
}
.sim-card button:hover{background:var(--amber);color:#0A1A0F}

/* ---------- module screen ---------- */
.mod-head{padding:28px 0 14px}
.mod-head .eyebrow{font-size:.72rem;letter-spacing:.24em;color:var(--amber);margin-bottom:6px}
.mod-head h2{font-family:'Inter','Heebo',sans-serif;font-weight:900;font-size:1.6rem;line-height:1.3}
.mod-head p{color:var(--muted);font-weight:300;font-size:.92rem;margin-top:6px}
.lesson-list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.lesson-item{
  display:flex;align-items:center;gap:14px;text-align:start;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;cursor:pointer;color:var(--cream);font-family:'Heebo';width:100%;
}
.lesson-item:hover{border-color:var(--amber)}
.lesson-item .check{
  width:26px;height:26px;border-radius:50%;flex-shrink:0;
  border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:.8rem;color:var(--bg);
}
.lesson-item.done .check{background:var(--green);border-color:var(--green)}
.lesson-item .li-title{font-weight:500;font-size:.95rem}
.lesson-item .li-sub{font-size:.78rem;color:var(--muted)}
.lesson-item.quiz-item{border-color:rgba(127,229,143,.4)}
.lesson-item.quiz-item .check{border-style:dashed}
.lesson-item.quiz-item.done .check{border-style:solid}
.badge-score{margin-inline-start:auto;font-size:.78rem;color:var(--green);font-weight:700}

/* ---------- lesson viewer ---------- */
.lesson-body{padding:26px 0 10px}
.lesson-body .eyebrow{font-size:.72rem;letter-spacing:.22em;color:var(--amber)}
.lesson-body h2{font-family:'Inter','Heebo',sans-serif;font-weight:900;font-size:1.55rem;margin:6px 0 14px;line-height:1.3}
.lesson-body h3{font-family:'Inter','Heebo',sans-serif;font-weight:700;font-size:1.12rem;color:var(--amber);margin:26px 0 8px}
.lesson-body p{margin-bottom:14px;font-weight:300;font-size:.98rem;color:var(--cream)}
.lesson-body strong{font-weight:700;color:var(--amber)}
.media-ph{
  margin:18px 0;border:1.5px dashed var(--line);border-radius:var(--radius);
  background:var(--bg-deep);padding:34px 16px;text-align:center;color:var(--muted);
  font-size:.85rem;
}
.media-ph span{display:block;font-size:1.6rem;margin-bottom:6px}
.lesson-nav{display:flex;gap:10px;margin-top:26px}
.btn{
  flex:1;border-radius:var(--radius);padding:13px;font-family:'Heebo';font-weight:700;
  font-size:.95rem;cursor:pointer;border:none;
}
.btn-primary{background:linear-gradient(180deg,var(--amber),var(--amber-deep));color:#0A1A0F}
.btn-ghost{background:none;border:1px solid var(--line);color:var(--cream)}
.btn-ghost:hover{border-color:var(--amber);color:var(--amber)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---------- recipe card ---------- */
.recipe-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  margin:20px 0;overflow:hidden;
}
.recipe-card .rc-head{
  padding:16px 18px 12px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, rgba(127,229,143,.07), transparent);
}
.recipe-card .rc-head h4{font-family:'Inter','Heebo',sans-serif;font-weight:900;font-size:1.2rem;color:var(--amber)}
.recipe-card .rc-head .rc-en{font-size:.75rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.recipe-card .rc-story{padding:12px 18px 0;font-size:.85rem;color:var(--muted);font-weight:300}
.rc-tabs{display:flex;border-bottom:1px solid var(--line);margin-top:12px}
.rc-tab{
  flex:1;background:none;border:none;color:var(--muted);font-family:'Heebo';
  padding:10px 4px;font-size:.85rem;cursor:pointer;border-bottom:2px solid transparent;
}
.rc-tab[aria-selected="true"]{color:var(--amber);border-bottom-color:var(--amber);font-weight:700}
.rc-panel{padding:16px 18px;display:none}
.rc-panel.active{display:block}
.ing-row{
  display:flex;justify-content:space-between;gap:10px;
  padding:8px 0;border-bottom:1px dashed rgba(127,229,143,.12);font-size:.92rem;
}
.ing-row:last-child{border-bottom:none}
.ing-row .amt{color:var(--amber);font-weight:500;white-space:nowrap}
.rc-panel ol{padding-inline-start:20px;font-size:.92rem;font-weight:300}
.rc-panel ol li{margin-bottom:8px}
.serve-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;font-size:.92rem}
.serve-row .s-ic{font-size:1.2rem}
.serve-row .s-label{font-size:.75rem;color:var(--muted);display:block}

/* ---------- quiz ---------- */
.quiz-head{padding:26px 0 8px;text-align:center}
.quiz-head .eyebrow{font-size:.72rem;letter-spacing:.24em;color:var(--amber)}
.quiz-head h2{font-family:'Inter','Heebo',sans-serif;font-weight:900;font-size:1.5rem;margin-top:4px}
.q-dots{display:flex;gap:6px;justify-content:center;margin:14px 0 20px}
.q-dots i{width:9px;height:9px;border-radius:50%;background:var(--surface);border:1px solid var(--line)}
.q-dots i.now{background:var(--amber);border-color:var(--amber)}
.q-dots i.ok{background:var(--green);border-color:var(--green)}
.q-dots i.bad{background:var(--red);border-color:var(--red)}
.q-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 18px}
.q-card .q-text{font-weight:500;font-size:1.05rem;margin-bottom:16px;line-height:1.6}
.q-opt{
  display:block;width:100%;text-align:start;margin-bottom:10px;
  background:var(--bg-deep);border:1px solid var(--line);border-radius:12px;
  color:var(--cream);font-family:'Heebo';font-size:.93rem;padding:13px 15px;cursor:pointer;
}
.q-opt:hover:not(:disabled){border-color:var(--amber)}
.q-opt.correct{border-color:var(--green);background:rgba(143,191,107,.12)}
.q-opt.wrong{border-color:var(--red);background:rgba(217,112,94,.12)}
.q-opt:disabled{cursor:default}
.q-feedback{
  margin-top:14px;padding:13px 15px;border-radius:12px;font-size:.88rem;display:none;
}
.q-feedback.show{display:block}
.q-feedback.good{background:rgba(143,191,107,.12);border:1px solid var(--green);color:var(--green)}
.q-feedback.bad{background:rgba(217,112,94,.10);border:1px solid var(--red);color:var(--cream)}
.q-feedback.bad b{color:var(--red)}
.quiz-result{text-align:center;padding:40px 0}
.quiz-result .big{font-family:'Inter','Heebo',sans-serif;font-weight:900;font-size:3rem}
.quiz-result .big.pass{color:var(--green)}
.quiz-result .big.fail{color:var(--red)}
.quiz-result p{color:var(--muted);margin:8px 0 24px}

/* ---------- simulator ---------- */
.sim-head{padding:26px 0 6px;text-align:center}
.sim-head h2{font-family:'Inter','Heebo',sans-serif;font-weight:900;font-size:1.5rem}
.sim-target{
  margin:14px 0 18px;text-align:center;background:var(--surface);
  border:1px solid rgba(127,229,143,.4);border-radius:var(--radius);padding:16px;
}
.sim-target .t-label{font-size:.75rem;letter-spacing:.2em;color:var(--muted)}
.sim-target .t-name{font-family:'Inter','Heebo',sans-serif;font-weight:900;font-size:1.5rem;color:var(--amber)}
.sim-step-label{font-size:.8rem;color:var(--muted);margin-bottom:8px}
.chip-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{
  background:var(--bg-deep);border:1px solid var(--line);border-radius:12px;
  color:var(--cream);font-family:'Heebo';font-size:.9rem;padding:14px 10px;cursor:pointer;
  text-align:center;
}
.chip .c-ic{display:block;font-size:1.5rem;margin-bottom:4px}
.chip:hover{border-color:var(--amber)}
.chip.picked{border-color:var(--amber);background:rgba(127,229,143,.12)}
.chip.correct{border-color:var(--green);background:rgba(143,191,107,.12)}
.chip.wrong{border-color:var(--red);background:rgba(217,112,94,.12)}
.sim-actions{margin-top:16px}
.sim-note{font-size:.8rem;color:var(--muted);text-align:center;margin-top:10px}

/* ---------- pouring stage ---------- */
.pour-row{background:var(--bg-deep);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.pour-top{display:flex;justify-content:space-between;font-size:.88rem;margin-bottom:8px}
.p-name{font-weight:500}
.p-target{color:var(--muted)}
.pour-bar{position:relative;height:14px;background:#0E0905;border:1px solid var(--line);border-radius:99px}
.p-fill{position:absolute;right:0;top:0;bottom:0;width:0;background:linear-gradient(270deg,var(--amber-deep),var(--amber));border-radius:99px;transition:width .08s linear}
.p-fill.over{background:var(--red)}
.p-mark{position:absolute;top:-3px;bottom:-3px;right:calc(66.7% - 1px);width:2px;background:var(--cream);opacity:.85;border-radius:2px}
.pour-ctrl{display:flex;align-items:center;gap:8px;margin-top:10px}
.p-cur{min-width:66px;font-size:.9rem;color:var(--amber);font-weight:700}
.fine{width:40px;height:40px;border-radius:10px;background:none;border:1px solid var(--line);color:var(--cream);font-size:1.05rem;cursor:pointer;flex-shrink:0}
.fine:hover{border-color:var(--amber);color:var(--amber)}
.hold-btn{flex:1;padding:10px 6px;border-radius:10px;border:1px solid var(--amber);background:rgba(127,229,143,.10);color:var(--amber);font-family:'Heebo';font-weight:700;font-size:.88rem;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.hold-btn:active{background:var(--amber);color:#0A1A0F}
.pour-row.locked .hold-btn,.pour-row.locked .fine{opacity:.35;pointer-events:none}
.p-verdict{font-size:.8rem;margin-top:8px;display:none}
.p-verdict.show{display:block}
.p-verdict.good{color:var(--green)}
.p-verdict.bad{color:var(--red)}

/* ---------- graduated pour gauge (targets hidden) ---------- */
.pour-bar.ticks{height:16px}
.pour-bar.ticks::after{
  content:"";position:absolute;inset:0;border-radius:99px;pointer-events:none;
  background:repeating-linear-gradient(to left,
    transparent, transparent calc(100%/var(--segs,6) - 1px),
    rgba(243,233,214,.28) calc(100%/var(--segs,6) - 1px), rgba(243,233,214,.28) calc(100%/var(--segs,6)));
}
.p-scale{display:flex;justify-content:space-between;font-size:.66rem;color:var(--muted);margin-top:3px;padding:0 1px}
.pour-row.exact{border-color:var(--green)}

/* =================================================================
   שכבת עיצוב מונפשת — נוזלים חיים, עומק, מיקרו-אינטראקציות
================================================================= */
/* אטמוספירה: הילות עשן-בר צפות */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:5;
  background:
    radial-gradient(420px 300px at 18% 22%, rgba(127,229,143,.05), transparent 70%),
    radial-gradient(520px 340px at 82% 78%, rgba(63,174,95,.05), transparent 70%);
  animation:ambient 16s ease-in-out infinite alternate;
}
@keyframes ambient{
  from{transform:translate3d(-2%,-1%,0) scale(1)}
  to{transform:translate3d(2%,2%,0) scale(1.06)}
}

/* עומק "פרו" לכרטיסים */
.q-card,.recipe-card,.sim-card,.progress-strip,.sim-target,.lesson-item{
  box-shadow:0 20px 45px -22px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.045);
  transition:transform .25s cubic-bezier(.22,1,.36,1), box-shadow .25s, border-color .25s;
}
.lesson-item:hover,.sim-card:hover{transform:translateY(-3px);box-shadow:0 26px 50px -22px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.05)}
button{transition:transform .15s cubic-bezier(.22,1,.36,1), filter .2s, background .2s, border-color .2s, color .2s}
button:active{transform:scale(.96)}
.btn-primary:hover,.continue-btn:hover{box-shadow:0 8px 26px -8px rgba(127,229,143,.55)}
.brand{text-shadow:0 0 18px rgba(127,229,143,.0);animation:brandGlow 5s ease-in-out infinite}
@keyframes brandGlow{0%,100%{text-shadow:0 0 8px rgba(127,229,143,.12)}50%{text-shadow:0 0 22px rgba(127,229,143,.38)}}

/* פס התקדמות: ברק נוזלי נודד */
.bar>i{position:relative;overflow:hidden}
.bar>i::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.4) 50%,transparent 70%);
  background-size:220% 100%;animation:sheen 2.6s ease-in-out infinite;
}
@keyframes sheen{from{background-position:200% 0}to{background-position:-100% 0}}

/* ---------- בקבוקים חיים: גל עליון + בועות עולות ---------- */
.bottle .liquid{overflow:visible}
.bottle .liquid::before{ /* פני נוזל מתנועעים */
  content:"";position:absolute;top:-5px;left:-25%;width:150%;height:10px;
  background:var(--amber);border-radius:42% 46% 40% 44%;opacity:.95;
  animation:wave 4.5s linear infinite;
}
.bottle.locked .liquid::before{background:#4a3b2b}
@keyframes wave{to{transform:rotate(360deg)}}
.bottle .liquid::after{ /* בועות */
  content:"";position:absolute;inset:0;opacity:.55;
  background-image:
    radial-gradient(circle, rgba(255,255,255,.5) 1px, transparent 1.6px),
    radial-gradient(circle, rgba(255,255,255,.35) 1px, transparent 1.4px);
  background-size:11px 18px, 7px 13px;
  background-position:2px 0, 5px 6px;
  animation:bubbles 3.2s linear infinite;
}
@keyframes bubbles{to{background-position:2px -36px, 5px -20px}}
.bottle-slot:hover .bottle{transform:rotate(-3deg) translateY(-4px)}
.bottle{transition:transform .35s cubic-bezier(.22,1,.36,1)}

/* ---------- מד המזיגה: נוזל חי וזרם מזיגה ---------- */
.p-fill{position:absolute;overflow:hidden}
.p-fill::after{
  content:"";position:absolute;inset:0;opacity:.5;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);
  background-size:240% 100%;animation:sheen 2.2s linear infinite;
}
.p-fill::before{ /* קצה נוזל מבעבע בחזית המזיגה */
  content:"";position:absolute;top:0;bottom:0;left:-1px;width:6px;
  background:radial-gradient(circle at 50% 30%, rgba(255,255,255,.55) 1px, transparent 2px),
             radial-gradient(circle at 50% 70%, rgba(255,255,255,.4) 1px, transparent 2px);
  opacity:0;transition:opacity .2s;
}
.pour-row.pouring .p-fill::before{opacity:1}
.pour-row.pouring .pour-bar{box-shadow:0 0 0 1px rgba(127,229,143,.45), 0 0 18px -4px rgba(127,229,143,.5)}
.pour-row .pour-bar::before{ /* זרם מהבקבוק */
  content:"";position:absolute;top:-24px;right:10px;width:3px;height:24px;border-radius:2px;
  background:linear-gradient(to bottom, var(--amber), rgba(127,229,143,.15));
  opacity:0;transform:scaleY(.2);transform-origin:top;transition:opacity .12s, transform .12s;
}
.pour-row.pouring .pour-bar::before{opacity:1;transform:scaleY(1);animation:stream .35s linear infinite}
@keyframes stream{
  0%{background-position:0 0;filter:brightness(1)}
  50%{filter:brightness(1.25)}
  100%{filter:brightness(1)}
}
.pour-row.pouring .hold-btn{background:var(--amber);color:#0A1A0F;box-shadow:0 0 20px -4px rgba(127,229,143,.7)}
.pour-row{transition:border-color .3s, box-shadow .3s}
.pour-row.exact{box-shadow:0 0 0 1px rgba(143,191,107,.35), 0 8px 22px -12px rgba(143,191,107,.4)}

/* ---------- צ'יפים ואפשרויות: כניסה קופצנית ---------- */
@keyframes popIn{from{opacity:0;transform:translateY(12px) scale(.94)}to{opacity:1;transform:none}}
.chip,.q-opt,.pour-row{animation:popIn .45s cubic-bezier(.22,1,.36,1) both}
.chip:nth-child(2),.q-opt:nth-of-type(2),.pour-row:nth-of-type(2){animation-delay:.06s}
.chip:nth-child(3),.q-opt:nth-of-type(3),.pour-row:nth-of-type(3){animation-delay:.12s}
.chip:nth-child(4),.q-opt:nth-of-type(4),.pour-row:nth-of-type(4){animation-delay:.18s}
.chip:nth-child(5){animation-delay:.24s}
.chip:nth-child(6){animation-delay:.3s}
.chip:hover:not(:disabled){transform:translateY(-3px)}
.q-feedback.show{animation:popIn .35s cubic-bezier(.22,1,.36,1) both}

/* כרטיס מתכון: ברק זכוכית בריחוף */
.recipe-card{position:relative;overflow:hidden}
.recipe-card::before{
  content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.06),transparent);
  transform:skewX(-12deg);transition:left .7s ease;
}
.recipe-card:hover::before{left:calc(100% + 80px)}

/* ---------- אייקוני SVG מקצועיים ---------- */
svg.ic{width:1.15em;height:1.15em;vertical-align:-.22em;flex-shrink:0}
.chip .c-ic svg.ic{width:27px;height:27px;color:var(--amber)}
.serve-row .s-ic{color:var(--amber);display:flex;align-items:center}
.serve-row .s-ic svg.ic{width:21px;height:21px}
.media-ph span svg.ic{width:36px;height:36px;color:var(--muted)}
.bottle .lock svg.ic{width:18px;height:18px}
.sim-card .icon{color:var(--amber);display:flex;align-items:center}
.sim-card .icon svg.ic{width:32px;height:32px}
.hold-btn svg.ic{width:18px;height:18px;margin-inline-end:4px}
.btn svg.ic{width:18px;height:18px;margin-inline-end:5px}

/* מד מדידה: פעימת נוזל בהוספה בדידה (כפית/עלה/טיפה) */
.pour-bar.splash .p-fill{animation:splash .32s ease}
@keyframes splash{45%{filter:brightness(1.45) saturate(1.2)}}
.p-unit{color:var(--muted);font-weight:400;font-size:.78rem}

/* מסך ביניים: הכנת הקוקטייל */
.prep-overlay{

================================================================= */

 {t:"תסיסה מול זיקוק",sub:"איך נולד אלכוהול",html:`
   <h3>תסיסה (Fermentation)</h3>
   <p>שמרים אוכלים סוכר ומייצרים אלכוהול ופחמן דו-חמצני. זהו התהליך שיוצר יין (מענבים) ובירה (מדגנים) — והוא מוגבל טבעית לכ-15% אלכוהול, כי מעבר לכך השמרים מתים.</p>
   <h3>זיקוק (Distillation)</h3>
   <p>כדי להגיע ל-40% ומעלה, מחממים נוזל מותסס: האלכוהול רותח לפני המים (78°C לעומת 100°C), האדים נאספים ומעובים בחזרה לנוזל מרוכז. <strong>התסיסה יוצרת את האלכוהול — הזיקוק מרכז אותו.</strong> כל תזקיק בעולם מתחיל מנוזל מותסס כלשהו.</p>
   <div class="media-ph"><span>🎬</span>כאן ישולב סרטון: מסע בתוך מזקקה</div>`},
 {t:"ששת תזקיקי הבסיס",sub:"וודקה · ג'ין · רום · טקילה · וויסקי · ברנדי",html:`
   <h3>מה עושה כל תזקיק</h3>
   <p><strong>וודקה</strong> — מזוקקת מדגנים או תפוחי אדמה לניקיון מרבי; קנבס נייטרלי לקוקטיילים. <strong>ג'ין</strong> — תזקיק נייטרלי שהושרה בצמחי תיבול, כשעל פי חוק חייב לככב בו ערער (Juniper). <strong>רום</strong> — מזוקק מקנה סוכר או מולסה, מהקריביים; לבן לקוקטיילים רעננים, כהה ומיושן ללגימה.</p>
   <p><strong>טקילה</strong> — אך ורק מאגבה כחולה במקסיקו; חפשו על התווית "100% Agave". <strong>וויסקי</strong> — דגנים מותססים שמזוקקים ומיושנים בחביות עץ, שמעניקות לו את הצבע הענברי ואת רוב הטעם: סקוץ' (סקוטלנד), בורבון (ארה"ב, תירס), אירי ויפני. <strong>ברנדי</strong> — זיקוק של יין או פרי מותסס; קוניאק הוא ברנדי מאזור מוגן בצרפת.</p>
   <div class="media-ph"><span>📷</span>כאן תשולב טבלה ויזואלית: ששת התזקיקים, חומרי הגלם והמדינות</div>`},
 {t:"ליקרים, יינות ואפריטיפים",sub:"ארון התבלינים של הבר",html:`
   <h3>ליקרים</h3>
   <p>ליקר = תזקיק + סוכר + טעם (פרי, עשבים, קפה, שקדים). דוגמאות שחוזרות בכל בר: קואנטרו/טריפל סק (תפוז), קמפרי ואפרול (מרים איטלקיים), ליקר קפה ואמארטו.</p>
   <h3>יינות מחוזקים ואפריטיפים</h3>
   <p><strong>ורמוט</strong> — יין מחוזק ומתובל, בגרסה יבשה (למרטיני) ומתוקה/רוסו (לנגרוני). חשוב: ורמוט הוא יין — לאחר פתיחה נשמר בקירור. <strong>אפריטיף</strong> מוגש לפני הארוחה לעורר תיאבון (קמפרי, ורמוט, שרי יבש); <strong>דיז'סטיף</strong> נלגם אחריה לסיוע בעיכול (אמארו, קוניאק, פורט).</p>

 {t:"בירות ומבעבעים",sub:"לאגר, אייל, פרוסקו ושמפניה",html:`
   <h3>בירה בשתי משפחות</h3>
   <p><strong>לאגר</strong> — תסיסה תחתית בקור: נקייה, פריכה וקלילה (פילזנר). <strong>אייל</strong> — תסיסה עילית בחום: פירותית ועשירה (פייל אייל, IPA, סטאוט). מזיגה נכונה: כוס בזווית 45°, יישור לקראת הסוף לשכבת קצף של כשתי אצבעות.</p>
   <h3>מבעבעים</h3>

{id:"m3",short:"טכניקות",title:"טכניקות מיקסולוגיה",subtitle:"Mixology Techniques",
 desc:"בנייה, ניעור, ערבוב, כתישה ובלנדר — מתי, למה ואיך. ולצידן: מזיגה מדויקת, סירופים וקישוטים.",
 lessons:[
 {t:"חמש שיטות ההכנה",sub:"Build · Shake · Stir · Muddle · Blend",html:`
   <h3>הכלל שמכריע הכול</h3>
   <p><strong>נוער (Shake)</strong> כל קוקטייל שמכיל מיצים, מוצרי חלב, ביצה או סירופים סמיכים — הניעור מקרר, מדלל ומאחד רכיבים בצפיפויות שונות (מרגריטה, דאקירי, וויסקי סאוור). <strong>מערבב (Stir)</strong> כשכל הרכיבים אלכוהוליים ושקופים — לשמירה על מרקם משיי וצלול (מרטיני, נגרוני, אולד פאשנד).</p>
   <p><strong>בנייה (Build)</strong> — מזיגה ישירה לכוס ההגשה על קרח (ג'ין טוניק, ספריץ). <strong>כתישה (Muddle)</strong> — מעיכה עדינה של רכיבים טריים בתחתית הכוס לשחרור שמנים ומיצים (מוחיטו, קייפרינייה). <strong>בלנדר (Blend)</strong> — לקוקטיילים קפואים עם קרח כתוש (פינה קולדה, פרוזן מרגריטה).</p>
   <div class="media-ph"><span>🎬</span>כאן ישולבו 5 סרטוני הדגמה — סרטון לכל טכניקה</div>
   <p>ניעור נכון: 10–15 שניות נמרצות, השייקר צונן ומכוסה כפור. ערבוב נכון: כ-30 שניות בתנועה חלקה, כף הבר צמודה לדופן.</p>`},
 {t:"מזיגה מדויקת",sub:"Jigger מול Free Pouring",html:`
   <h3>ג'יגר: הדיוק כברירת מחדל</h3>
   <p>מזיגה בג'יגר מבטיחה עקביות מוחלטת בין כוס לכוס ושליטה בעלויות. במדידה נכונה ממלאים עד קו השפה בדיוק — לא "בערך".</p>
   <h3>Free Pouring: מהירות עם משמעת</h3>
   <p>מזיגה חופשית עם פקק מזיגה (Pourer) לפי ספירה: בקצב תקני, כל ספירה ("one-and") שווה כ-15 מ״ל, כך ש-<strong>ארבע ספירות = 60 מ״ל</strong>. השיטה מהירה יותר אך דורשת אימון קבוע ובדיקות דיוק (Pour Test) עם ג'יגר וכוס מדידה. הכלל המקצועי: לומדים לדייק עם ג'יגר — ורק אז מרוויחים מהירות.</p>
   <div class="media-ph"><span>🎬</span>כאן ישולב סרטון: תרגול ספירת מזיגה עם בקבוק אימון</div>`},
 {t:"סירופים, סאוור וקישוטים",sub:"המרכיבים שמכינים לבד",html:`
   <h3>סירופ פשוט (Simple Syrup)</h3>
   <p>היחס הקלאסי: <strong>1:1 סוכר ומים</strong> — מחממים עד המסה מלאה, מצננים ושומרים בקירור עד שבועיים. גרסת Rich Syrup ביחס 2:1 מתוקה וסמיכה יותר. מכאן קצרה הדרך לסירופים בטעמים: ג'ינג'ר, נענע, דבש (3:1 דבש-מים חמים).</p>
   <h3>סאוור מיקס ביתי</h3>
   <p>שוכחים מהבקבוק התעשייתי: מיץ לימון/ליים <strong>טרי</strong> + סירופ פשוט. נוסחת הזהב של משפחת הסאוור: 2 חלקים אלכוהול, 1 חלק חמוץ, 1 חלק מתוק — נקודת פתיחה לאיזון לפי טעם.</p>
   <h3>קישוט (Garnish)</h3>
   <p>הקישוט הוא ארומה, לא רק יופי: <strong>טוויסט</strong> — סוחטים את קליפת ההדר מעל הכוס לשחרור השמנים ואז מניחים; פלחים על השפה; מלח/סוכר על השוליים (Rim); ונענע שמונחת גבוה — קרוב לאף.</p>
   <div class="media-ph"><span>📷</span>כאן תשולב גלריית קישוטים מקצועית</div>`}
 ],
 quiz:[
 {q:"מתי נכון לערבב (Stir) ולא לנעור (Shake)?",o:["כשיש מיץ הדרים במתכון","כשכל הרכיבים אלכוהוליים ושקופים","כשיש חלבון ביצה","כשרוצים משקה קר במיוחד בלבד"],a:1,exp:"ערבוב שומר על צלילות ומרקם משיי — לכן מרטיני, נגרוני ואולד פאשנד מעורבבים. מיצים, ביצה וחלב דורשים ניעור."},
 {q:"מה פירוש Muddle?",o:["מזיגה בשכבות","כתישה עדינה של רכיבים טריים בתחתית הכוס","סינון כפול","ניעור ללא קרח"],a:1,exp:"כתישה (במאדלר) משחררת שמנים ומיצים מנענע, ליים או פירות — הבסיס של מוחיטו וקייפרינייה. תמיד בעדינות."},
 {q:"אילו קוקטיילים דורשים Shake & Strain?",o:["כאלה שמכילים רק תזקיקים וורמוט","קוקטיילים עם מיצים, ביצה או רכיבים סמיכים","רק משקאות חמים","משקאות עם סודה"],a:1,exp:"הניעור מאחד רכיבים בצפיפויות שונות — מיצים, סירופים, ביצה וחלב — ולכן מרגריטה, דאקירי וסאוור תמיד נוערים."},
 {q:"מהי מזיגה חופשית (Free Pouring)?",o:["מזיגה לפי ספירה עם פקק מזיגה, ללא ג'יגר","מזיגה ללא תשלום ללקוח","מזיגת כל הבקבוק לשייקר","מזיגה עם שתי ידיים"],a:0,exp:"Free Pouring היא מזיגה בקצב ספירה תקני (כ-15 מ״ל לספירה) — מהירה, אך דורשת אימון ובדיקות דיוק קבועות."},
 {q:"מהו היחס בסירופ פשוט (Simple Syrup) קלאסי?",o:["1:3 סוכר-מים","2:1 מים-סוכר בלבד","1:1 סוכר ומים","סוכר בלבד מומס באלכוהול"],a:2,exp:"סירופ פשוט = חלק סוכר על חלק מים, מומס בחימום עדין. גרסת Rich (2:1 סוכר-מים) סמיכה ומתוקה יותר."}
 ]},

{id:"m5",short:"ניהול",title:"שירות, מכירות וניהול בר",subtitle:"Bar Management",
 desc:"פסיכולוגיית אירוח, שתייה אחראית, ניהול מלאי, חישוב עלות כוס ותמחור.",
 lessons:[
 {t:"פסיכולוגיית אירוח ושירות",sub:"הלקוח לא קונה משקה — הוא קונה חוויה",html:`
   <h3>שלושת שלבי המפגש</h3>
   <p><strong>קבלת פנים</strong> — קשר עין וברכה תוך 30 שניות מהתיישבות הלקוח, גם אם אתם עסוקים ("שנייה ואני אצלך" שווה זהב). <strong>ליווי</strong> — קריאת הלקוח: מי רוצה שיחה ומי רוצה שקט, מי מתלבט וזקוק להמלצה. <strong>סגירה</strong> — פרידה אישית שמייצרת לקוח חוזר.</p>
   <h3>מכירה מקצועית</h3>
   <p>המלצה טובה מתחילה בשאלה ("חמוץ-רענן או חזק-מרוכז?") ולא ברשימת מלאי. <strong>Upselling</strong> נכון מציע שדרוג שמשרת את הלקוח ("במרגריטה הזו טקילת 100% אגבה עושה הבדל אמיתי") — לעולם לא דחיפה של הפריט היקר ביותר.</p>
   <div class="media-ph"><span>🎬</span>כאן ישולב סרטון: סימולציית שירות מול לקוח מתלבט</div>`},
 {t:"שתייה אחראית",sub:"האחריות החוקית והמוסרית של הברמן",html:`
   <h3>זיהוי סימני שכרות</h3>
   <p>דיבור מעורפל או רם מהרגיל, איבוד שיווי משקל, תגובות איטיות, שינוי התנהגות חד. ברמן מקצועי עוקב אחרי קצב השתייה של לקוחותיו — לא רק אחרי ההזמנות.</p>
   <h3>סירוב מקצועי</h3>
   <p>מסרבים בשקט, בגובה העיניים וללא האשמה: "אני לא יכול למזוג לך עוד הערב — אבל אשמח להביא לך מים או משהו לאכול." מציעים חלופות, מערבים אחראי משמרת בעת הצורך, ומוודאים שהלקוח לא נוהג. <strong>בדיקת תעודה מזהה</strong> לכל מי שנראה צעיר — חובה, לא נימוס. מכירת אלכוהול לקטינים אסורה על פי חוק.</p>
   <div class="media-ph"><span>📷</span>כאן ישולב תרשים: פרוטוקול סירוב הגשה</div>`},
 {t:"מלאי, עלות כוס ותמחור",sub:"הצד העסקי של הבר",html:`
   <h3>ניהול מלאי</h3>
   <p>עקרון <strong>FIFO — First In, First Out</strong>: הסחורה הישנה נמכרת ראשונה. ספירת מלאי שבועית משווה בין הצריכה בפועל למכירות בקופה — הפער (Variance) חושף שפיכות, מזיגות יתר או חוסרים.</p>
   <h3>עלות כוס (Pour Cost)</h3>
   <p>הנוסחה: <strong>עלות הרכיבים ÷ מחיר המכירה × 100</strong>. דוגמה: קוקטייל שרכיביו עולים 9 ₪ ונמכר ב-45 ₪ — עלות הכוס היא 20%. היעד המקובל בענף: 18%–24%. מכאן נגזר התמחור: מחלקים את עלות הרכיבים ביעד העלות הרצוי ומעגלים למחיר תפריט הגיוני.</p>
   <p>מזיגת יתר של 5 מ״ל לכוס נשמעת זניחה — אבל על אלף כוסות בחודש זה בקבוק שלם שנעלם. הדיוק בג'יגר הוא כסף.</p>
   <div class="media-ph"><span>📷</span>כאן תשולב מחשבונית: תרגול חישובי Pour Cost</div>`}
 ],
 quiz:[
 {q:"אילו מהבאים הם סימני שכרות מובהקים?",o:["בקשת מים מרובה","דיבור מעורפל ואיבוד שיווי משקל","הזמנת קוקטייל ללא אלכוהול","ישיבה ממושכת בבר"],a:1,exp:"דיבור מעורפל, איבוד שיווי משקל, תגובות איטיות ושינוי התנהגות חד — אלו הסימנים שמחייבים עצירת הגשה."},
 {q:"איך מחשבים עלות כוס (Pour Cost)?",o:["מחיר המכירה פחות המע\"מ","עלות הרכיבים חלקי מחיר המכירה, כפול 100","מחיר הבקבוק חלקי מספר הכוסות","שכר הברמן חלקי מספר המשקאות"],a:1,exp:"Pour Cost = עלות רכיבים ÷ מחיר מכירה × 100. היעד המקובל בענף: 18%–24%."},
 {q:"מה משמעות עקרון FIFO בניהול מלאי?",o:["המשקה היקר נמכר ראשון","ראשון נכנס — ראשון יוצא: הסחורה הישנה נמכרת קודם","קונים רק ממלאי קיים","סופרים מלאי פעם בשנה"],a:1,exp:"First In, First Out: מסדרים את המלאי כך שהסחורה הוותיקה נמצאת מקדימה ונצרכת ראשונה — פחות פחת ופגי תוקף."},

/* =========================================================
   שמירת התקדמות (window.storage, עם גיבוי בזיכרון)
========================================================= */
const STORE_KEY="bartender-course-v1";
let state={done:{},scores:{},last:null,simStats:{},simLast:null};
let memOnly=false;
async function loadState(){
  try{
    if(window.storage){
      const r=await window.storage.get(STORE_KEY);
      if(r&&r.value) state=JSON.parse(r.value);
    }else memOnly=true;
  }catch(e){/* מפתח לא קיים / שגיאה — מתחילים נקי */}
}
async function saveState(){
  if(memOnly||!window.storage) return;
  try{ await window.storage.set(STORE_KEY,JSON.stringify(state)); }
  catch(e){ console.error("storage save failed",e); }
}

========================================================= */
const passed=m=>(state.scores[m.id]||0)>=80;
const doneCount=m=>(state.done[m.id]||[]).length;
function modPct(m){
  const total=m.lessons.length+1;
  return Math.round((doneCount(m)+(passed(m)?1:0))/total*100);
}
function coursePct(){
  let d=0,t=0;
  MODULES.forEach(m=>{t+=m.lessons.length+1;d+=doneCount(m)+(passed(m)?1:0);});
  return Math.round(d/t*100);
}
const unlocked=i=>true; /* כל המודולים והשיעורים פתוחים לניווט חופשי */

/* =========================================================
   Dashboard — באנר "המשך למידה" + קרוסלות אופקיות
========================================================= */
function glassIcon(g){
  if(g.includes("רוקס"))return ICON.rocks;
  if(g.includes("הייבול"))return ICON.highball;
  if(g.includes("מרטיני"))return ICON.martini;
  return ICON.coupe;
}
const HE_CAT={"The Unforgettables":"הקלאסיקות הבלתי-נשכחות","Contemporary Classics":"הקלאסיקות המודרניות","New Era Drinks":"הדור החדש"};
function renderDash(){
  /* באנר המשך למידה */
  let mi=0,li=0;
  if(state.last){mi=state.last.m;li=Math.min(state.last.l,MODULES[mi].lessons.length-1);}
  const m=MODULES[mi],pct=coursePct(),mp=modPct(m);
  $("#hbEyebrow").textContent=state.last?`המשך למידה · הושלמו ${pct}% מהקורס`:"קורס ברמנים בינלאומי · IBA";
  $("#hbTitle").textContent=state.last?m.lessons[li].t:"מאחורי כל בר גדול עומדת שיטה";
  $("#hbSub").textContent=state.last
    ?`מודול ${mi+1} · ${m.title} · שיעור ${li+1} מתוך ${m.lessons.length}`
    :"חמישה מודולים, על פי הסטנדרט הבינלאומי — מהג'יגר הראשון ועד ניהול הבר.";
  $("#dashPct").textContent=mp+"%";
  $("#dashBar").style.width=mp+"%";
  $("#cbText").textContent=state.last?(pct===100?"צפייה חוזרת":"המשך"):"התחל ללמוד";

  /* קרוסלת מודולים — הבקבוקים החיים */
  const shelf=$("#shelf");shelf.innerHTML="";
  MODULES.forEach((mod,i)=>{
    const p=modPct(mod);
    const t=document.createElement("button");
    t.className="mod-tile";
    t.innerHTML=`
      <div class="bottle" style="--fill:${p}%"><div class="neck"></div><div class="body"><div class="liquid"></div></div></div>
      <span class="m-name">מודול ${i+1}<br>${mod.title}</span>
      <div class="mini-bar"><i style="width:${p}%"></i></div>
      <span class="m-pct">${p}% הושלמו${passed(mod)?" · מבחן עבר":""}</span>`;
    t.addEventListener("click",()=>openModule(i));
    shelf.appendChild(t);
  });

  /* קרוסלות קוקטיילים לפי קטגוריות IBA */
  const cats=[];
  Object.entries(RECIPES).forEach(([k,r])=>{
    let c=cats.find(x=>x.name===r.cat);
    if(!c){c={name:r.cat,items:[]};cats.push(c);}
    c.items.push([k,r]);
  });
  $("#cocktailRows").innerHTML=cats.map((c,ci)=>`
    <div class="row-head"><h2>${HE_CAT[c.name]||c.name} <span class="row-en">${c.name}</span></h2>
      <div class="row-arrows"><button data-row="crow${ci}" aria-label="גלילה">‹</button><button data-row="crow${ci}" data-dir="1" aria-label="גלילה">›</button></div></div>
    <div class="hrow" id="crow${ci}">
      ${c.items.map(([k,r])=>`
        <button class="rc-tile" data-k="${k}">
          <span class="t-ic">${glassIcon(r.glass)}</span>
          <span class="t-name">${r.name}</span>
          <span class="t-en">${r.en}</span>
        </button>`).join("")}
    </div>`).join("");
  $("#cocktailRows").querySelectorAll(".rc-tile").forEach(t=>t.addEventListener("click",()=>openRecipe(t.dataset.k)));
  show("dash");
}
/* חיצי גלילה לקרוסלות (עכבר) — בטלפון גוללים באצבע */

function openModule(i){
  cur.mod=i;
  const m=MODULES[i];
  $("#modEyebrow").textContent=`מודול ${i+1} · ${m.subtitle}`;
  $("#modTitle").textContent=m.title;
  $("#modDesc").textContent=m.desc;
  const list=$("#lessonList");list.innerHTML="";
  m.lessons.forEach((l,j)=>{
    const d=(state.done[m.id]||[]).includes(j);
    const el=document.createElement("button");
    el.className="lesson-item"+(d?" done":"");
    el.innerHTML=`<span class="check">${d?"✓":""}</span>
      <span><span class="li-title">${j+1}. ${l.t}</span><br><span class="li-sub">${l.sub}</span></span>`;
    el.addEventListener("click",()=>openLesson(i,j));
    list.appendChild(el);
  });
  const qDone=passed(m);
  const q=document.createElement("button");
  q.className="lesson-item quiz-item"+(qDone?" done":"");
  q.innerHTML=`<span class="check">${qDone?"✓":"?"}</span>
    <span><span class="li-title">מבחן המודול</span><br><span class="li-sub">${m.quiz.length} שאלות · ציון עובר 80%</span></span>
    ${state.scores[m.id]!=null?`<span class="badge-score">${state.scores[m.id]}%</span>`:""}`;
  q.addEventListener("click",()=>startQuiz(i));
  list.appendChild(q);
  show("module");
}

  </div>`;
}
function openLesson(mi,li){
  cur.mod=mi;cur.lesson=li;cur.recipeView=false;
  document.querySelector("#scr-lesson .lesson-nav").style.display="flex";
  const m=MODULES[mi],l=m.lessons[li];
  let html=l.html.replace(/\{\{recipe:(\w+)\}\}/g,(_,k)=>recipeCard(k)).replace(/🎬/g,ICON.video).replace(/📷/g,ICON.camera);
  $("#lessonBody").innerHTML=`

$("#lessonBody").addEventListener("click",e=>{

});
$("#lessonBackBtn").addEventListener("click",()=>openModule(cur.mod));
$("#lessonDoneBtn").addEventListener("click",()=>{
  const m=MODULES[cur.mod];
  state.done[m.id]=state.done[m.id]||[];
  if(!state.done[m.id].includes(cur.lesson))state.done[m.id].push(cur.lesson);

/* =========================================================
   מנוע המבחנים
========================================================= */
let quiz={mi:0,i:0,correct:0,answers:[]};
function startQuiz(mi){
  cur.mod=mi;
  quiz={mi,i:0,correct:0,answers:[]};
  $("#quizTitle").textContent=MODULES[mi].title;
  renderQuestion();
  show("quiz");
}
function renderDots(){
  const m=MODULES[quiz.mi];
  $("#qDots").innerHTML=m.quiz.map((_,i)=>{
    let c="";
    if(i<quiz.answers.length)c=quiz.answers[i]?"ok":"bad";
    else if(i===quiz.i)c="now";
    return `<i class="${c}"></i>`;
  }).join("");
}
function renderQuestion(){
  const m=MODULES[quiz.mi],q=m.quiz[quiz.i];
  renderDots();
  $("#quizArea").innerHTML=`
    <div class="q-card">
      <div class="q-text">${quiz.i+1}. ${q.q}</div>
      ${q.o.map((o,i)=>`<button class="q-opt" data-i="${i}">${o}</button>`).join("")}
      <div class="q-feedback" id="qFb"></div>
      <div class="sim-actions"><button class="btn btn-primary" id="qNext" style="display:none;width:100%">
        ${quiz.i<m.quiz.length-1?"לשאלה הבאה":"לתוצאה"}</button></div>
    </div>`;
  document.querySelectorAll(".q-opt").forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.i)));
}
function answer(pick){
  const m=MODULES[quiz.mi],q=m.quiz[quiz.i];
  const ok=pick===q.a;
  quiz.answers.push(ok);if(ok)quiz.correct++;
  document.querySelectorAll(".q-opt").forEach((b,i)=>{
    b.disabled=true;
    if(i===q.a)b.classList.add("correct");
    else if(i===pick)b.classList.add("wrong");
  });
  const fb=$("#qFb");
  fb.className="q-feedback show "+(ok?"good":"bad");
  fb.innerHTML=ok?"✓ תשובה נכונה! "+q.exp:`<b>לא מדויק.</b> ${q.exp}`;
  renderDots();
  const next=$("#qNext");next.style.display="block";
  next.addEventListener("click",()=>{
    quiz.i++;
    if(quiz.i<m.quiz.length)renderQuestion();else quizResult();
  });
}
function quizResult(){
  const m=MODULES[quiz.mi];
  const score=Math.round(quiz.correct/m.quiz.length*100);
  const pass=score>=80;
  if(pass&&score>(state.scores[m.id]||0)){state.scores[m.id]=score;saveState();}
  else if(!pass&&state.scores[m.id]==null){state.scores[m.id]=score;saveState();}
  const isLast=quiz.mi===MODULES.length-1;
  $("#qDots").innerHTML="";
  $("#quizArea").innerHTML=`
    <div class="quiz-result">
      <div class="big ${pass?"pass":"fail"}">${score}%</div>
      <p>${pass
        ?(isLast?"כל הכבוד! השלמת את כל הקורס — הבר מחכה לך":"עברת! ציון מקצועי")
        :"נדרש ציון 80% למעבר. חזרו על השיעורים ונסו שוב — זה חלק מהאימון."}</p>
      <div class="lesson-nav">
        ${pass&&!isLast?`<button class="btn btn-primary" id="rNext">למודול הבא</button>`:""}
        ${!pass?`<button class="btn btn-primary" id="rRetry">נסה שוב</button>`:""}
        <button class="btn btn-ghost" id="rBack">${pass&&isLast?"חזרה למדף":"לרשימת השיעורים"}</button>
      </div>
    </div>`;
  const n=$("#rNext");if(n)n.addEventListener("click",()=>openModule(quiz.mi+1));
  const r=$("#rRetry");if(r)r.addEventListener("click",()=>startQuiz(quiz.mi));
  $("#rBack").addEventListener("click",()=>pass&&isLast?renderDash():openModule(quiz.mi));
}

/* =========================================================
   סימולטור הקוקטיילים — 5 שלבים + חזרה מרווחת
========================================================= */
let sim={round:null,step:0,score:0,picked:new Set(),pourVals:[],pourLocked:false,timer:null};
const SIM_STEPS=5;

/* בחירה אדפטיבית: קוקטייל שהצלחתם בו מקבל משקל נמוך (יופיע פחות),
   קוקטייל שנכשלתם בו מקבל משקל גבוה (יחזור לתרגול) */
function pickRound(){
  const stats=state.simStats||{};
  let pool=SIM_ROUNDS.filter(r=>r.key!==state.simLast);
  if(!pool.length)pool=SIM_ROUNDS;
  const w=r=>stats[r.key]!=null?stats[r.key]:1;
  const total=pool.reduce((a,r)=>a+w(r),0);
  let t=Math.random()*total;
  for(const r of pool){t-=w(r);if(t<=0)return r;}
  return pool[pool.length-1];
}
function updateSimStats(key,success,strongFail){
  state.simStats=state.simStats||{};
  const cur=state.simStats[key]!=null?state.simStats[key]:1;
  state.simStats[key]=success?Math.max(.15,+(cur*.5).toFixed(3))
                             :Math.min(6,+(cur*(strongFail?2:1.6)).toFixed(3));
  state.simLast=key;
  saveState();
}

function startSim(forceKey){
  const forced=typeof forceKey==="string"?SIM_ROUNDS.find(x=>x.key===forceKey):null;
  const r=forced||pickRound();
  sim={round:r,step:0,score:0,picked:new Set(),pourVals:[],pourLocked:false,timer:null};
  $("#simTargetName").textContent=RECIPES[r.key].name+" · "+RECIPES[r.key].en;
  renderSimStep();
  show("sim");
}
function simChoiceStep(label,options,correctName){
  $("#simArea").innerHTML=`
    <div class="q-card">
      <div class="sim-step-label">שלב ${sim.step+1} מתוך ${SIM_STEPS} · ${label}</div>
      <div class="chip-grid">
        ${options.map(o=>`<button class="chip" data-n="${o.n}"><span class="c-ic">${o.ic}</span>${o.n}</button>`).join("")}
      </div>
      <div class="q-feedback" id="sFb"></div>
      <div class="sim-actions"><button class="btn btn-primary" id="sNext" style="display:none;width:100%">המשך</button></div>
    </div>`;
  document.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{
    const ok=c.dataset.n===correctName;
    if(ok)sim.score++;
    document.querySelectorAll(".chip").forEach(x=>{
      x.disabled=true;
      if(x.dataset.n===correctName)x.classList.add("correct");
      else if(x===c)x.classList.add("wrong");
    });
    const fb=$("#sFb");
    fb.className="q-feedback show "+(ok?"good":"bad");
    fb.innerHTML=ok?"✓ בדיוק!":`<b>לא הפעם.</b> הבחירה הנכונה: ${correctName}`;
    const n=$("#sNext");n.style.display="block";
    n.addEventListener("click",()=>{sim.step++;renderSimStep();});
  }));
}
function simIngredientsStep(){
  const r=sim.round;
  $("#simArea").innerHTML=`
    <div class="q-card">
      <div class="sim-step-label">שלב ${sim.step+1} מתוך ${SIM_STEPS} · בחרו את כל הרכיבים (${r.ings.length})</div>
      <div class="chip-grid">
        ${r.pool.map(n=>`<button class="chip" data-n="${n}">${n}</button>`).join("")}
      </div>
      <div class="q-feedback" id="sFb"></div>
      <div class="sim-actions"><button class="btn btn-primary" id="sPour" style="width:100%">הרכיבים מוכנים</button></div>
      <p class="sim-note">אפשר ללחוץ שוב על רכיב כדי להסירו</p>
    </div>`;
  sim.picked=new Set();
  document.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{
    if(c.disabled)return;
    const n=c.dataset.n;
    if(sim.picked.has(n)){sim.picked.delete(n);c.classList.remove("picked");}
    else{sim.picked.add(n);c.classList.add("picked");}
  }));
  $("#sPour").addEventListener("click",()=>{
    const correct=new Set(r.ings);
    const exact=sim.picked.size===correct.size&&[...sim.picked].every(x=>correct.has(x));
    if(exact)sim.score++;
    document.querySelectorAll(".chip").forEach(x=>{
      x.disabled=true;
      const isC=correct.has(x.dataset.n),isP=sim.picked.has(x.dataset.n);
      if(isC)x.classList.add("correct");
      else if(isP)x.classList.add("wrong");
    });
    const fb=$("#sFb");
    fb.className="q-feedback show "+(exact?"good":"bad");
    fb.innerHTML=exact?"✓ סט רכיבים מושלם! עכשיו — למזיגה.":`<b>לא מדויק.</b> הרכיבים הנכונים: ${r.ings.join(", ")}. נתרגל אותם במזיגה.`;
    const btn=$("#sPour");btn.innerHTML=ICON.bottle+" למדידת הרכיבים";
    btn.replaceWith(btn.cloneNode(true));
    $("#sPour").addEventListener("click",()=>{sim.step++;renderSimStep();});
  });
}

/* ---------- שלב המדידה מהזיכרון — כל רכיב נמדד, כל אחד ביחידה שלו ---------- */
const UNITS={
 ml:{label:"מ״ל",max:90,segs:6,hold:true},
 tsp:{label:"כפיות",max:4,segs:4,btn:"הוסיפו כפית",ic:"spoon"},
 leaf:{label:"עלים",max:10,segs:5,btn:"הוסיפו עלה",ic:"leaf"},
 dash:{label:"טיפות",max:6,segs:6,btn:"טפטפו טיפה",ic:"drop"},
 cube:{label:"קוביות",max:3,segs:3,btn:"הוסיפו קובייה",ic:"sugar"}
};
function simPourStep(){
  const r=sim.round;
  sim.pourVals=r.pours.map(()=>0);
  sim.pourLocked=false;
  sim.pourAttempts=0;
  const rows=r.pours.map((p,i)=>{
    const U=UNITS[p[2]];
    const nums=Array.from({length:U.segs+1},(_,k)=>Math.round(U.max*k/U.segs));
    const act=U.hold
      ?`<button class="hold-btn" data-kind="hold">${ICON.bottle} החזיקו למזיגה</button>`
      :`<button class="hold-btn" data-kind="add">${ICON[U.ic]} ${U.btn}</button>`;
    return `
    <div class="pour-row" data-i="${i}">
      <div class="pour-top"><span class="p-name">${p[0]} <span class="p-unit">· ${U.label}</span></span><span class="p-cur">0 ${U.label}</span></div>
      <div class="pour-bar ticks" style="--segs:${U.segs}"><i class="p-fill"></i></div>
      <div class="p-scale">${nums.map(x=>`<span>${x}</span>`).join("")}</div>
      <div class="pour-ctrl">
        <button class="fine" data-d="-1" aria-label="הפחתה">−</button>
        <button class="fine" data-d="1" aria-label="הוספה">+</button>
        ${act}
      </div>
      <div class="p-verdict"></div>
    </div>`;
  }).join("");
  $("#simArea").innerHTML=`
    <div class="q-card">
      <div class="sim-step-label">שלב ${sim.step+1} מתוך ${SIM_STEPS} · מדדו כל רכיב מהזיכרון — הכמויות לא כתובות</div>
      ${rows}
      <div class="q-feedback" id="sFb"></div>
      <div class="sim-actions"><button class="btn btn-primary" id="pDone" style="width:100%">בדיקת מדידה</button></div>
      <p class="sim-note">נוזלים מוזגים בהחזקת הבקבוק על מד 0–90 מ״ל; סוכר, עלים וטיפות מוסיפים בלחיצה. ממשיכים רק כשכל רכיב מדויק בול — דיוק מהבדיקה הראשונה מזכה בנקודה.</p>
    </div>`;
  const updateRow=(i,splash)=>{
    const U=UNITS[r.pours[i][2]];
    const row=document.querySelector(`.pour-row[data-i="${i}"]`);
    row.querySelector(".p-cur").textContent=sim.pourVals[i]+" "+U.label;
    row.querySelector(".p-fill").style.width=(sim.pourVals[i]/U.max*100)+"%";
    if(splash){const bar=row.querySelector(".pour-bar");bar.classList.remove("splash");void bar.offsetWidth;bar.classList.add("splash");}
  };
  document.querySelectorAll(".pour-row").forEach(row=>{
    const i=+row.dataset.i,U=UNITS[r.pours[i][2]];
    const act=row.querySelector(".hold-btn");
    const stopPour=()=>{if(sim.timer){clearInterval(sim.timer);sim.timer=null;}};
    if(U.hold){
      act.addEventListener("pointerdown",e=>{
        if(sim.pourLocked||row.classList.contains("locked"))return;
        e.preventDefault();stopPour();
        sim.timer=setInterval(()=>{sim.pourVals[i]=Math.min(U.max,sim.pourVals[i]+1);updateRow(i);},70);
      });
      ["pointerup","pointerleave","pointercancel"].forEach(ev=>act.addEventListener(ev,stopPour));
    }else{
      act.addEventListener("click",()=>{
        if(sim.pourLocked||row.classList.contains("locked"))return;
        sim.pourVals[i]=Math.min(U.max,sim.pourVals[i]+1);updateRow(i,true);
      });
    }
    row.querySelectorAll(".fine").forEach(b=>b.addEventListener("click",()=>{
      if(sim.pourLocked||row.classList.contains("locked"))return;
      sim.pourVals[i]=Math.max(0,Math.min(U.max,sim.pourVals[i]+(+b.dataset.d)));
      updateRow(i,b.dataset.d==="1");
    }));
  });
  $("#pDone").addEventListener("click",()=>{
    if(sim.pourLocked)return;
    if(sim.timer){clearInterval(sim.timer);sim.timer=null;}
    sim.pourAttempts++;
    let allExact=true;
    r.pours.forEach((p,i)=>{
      const row=document.querySelector(`.pour-row[data-i="${i}"]`);
      const v=row.querySelector(".p-verdict");
      const diff=sim.pourVals[i]-p[1];
      if(diff===0){
        row.classList.add("locked","exact");
        v.textContent="✓ כמות מדויקת — הרכיב ננעל";
        v.className="p-verdict show good";
      }else{
        allExact=false;
        v.textContent=diff>0?"נמדד יותר מדי — הפחיתו":"עדיין חסר — הוסיפו";
        v.className="p-verdict show bad";
      }
    });
    const fb=$("#sFb");
    if(allExact){
      sim.pourLocked=true;
      if(sim.pourAttempts===1)sim.score++;
      fb.className="q-feedback show good";
      fb.innerHTML=sim.pourAttempts===1
        ?"✓ מדויק בול מהבדיקה הראשונה — זיכרון של ברמן!"
        :`✓ הגעתם לכמויות המדויקות אחרי ${sim.pourAttempts} בדיקות. הנקודה ניתנת רק על דיוק מהבדיקה הראשונה — המתכון המלא יוצג בסוף לחזרה.`;
      const btn=$("#pDone");btn.textContent="המשך לשלב הבא";
      btn.replaceWith(btn.cloneNode(true));
      $("#pDone").addEventListener("click",()=>{sim.step++;renderSimStep();});
    }else{
      fb.className="q-feedback show bad";
      fb.innerHTML="<b>עוד לא מדויק.</b> תקנו לפי המשוב שליד כל רכיב ובדקו שוב — ממשיכים רק בכמויות המדויקות.";
    }
  });
}

function renderSimStep(){
  const r=sim.round;
  if(sim.step===0)simChoiceStep("באיזו כוס נגיש?",SIM_GLASSES,r.glass);
  else if(sim.step===1)simChoiceStep("איזה קרח?",SIM_ICE,r.ice);
  else if(sim.step===2)simIngredientsStep();
  else if(sim.step===3)simPourStep();
  else if(sim.step===4)simChoiceStep("באיזו טכניקה נכין?",SIM_TECH,r.tech);
  else simResult();
}
function simResult(){
  const r=sim.round,success=sim.score>=4,strongFail=sim.score<=2;
  updateSimStats(r.key,success,strongFail);
  const msg=sim.score===5?"קוקטייל מושלם! הלקוח משאיר טיפ נדיב"
    :sim.score===4?"כמעט מושלם — עוד סבב ואתם שם"
    :sim.score===3?"יש בסיס. חזרו למודול 4 ותרגלו שוב"
    :"הלקוח החזיר את הכוס... זה קורה לכולם בהתחלה";
  const adapt=success
    ?`ה${RECIPES[r.key].name} שוּלט — הוא יופיע בתדירות נמוכה יותר, כדי לפנות מקום למה שדורש תרגול.`
    :`ה${RECIPES[r.key].name} יחזור בקרוב לתרגול נוסף — ככה בונים שליטה.`;
  $("#simArea").innerHTML=`
    <div class="quiz-result" style="padding-top:16px">
      <div class="big ${success?"pass":"fail"}">${sim.score}/5</div>
      <p>${msg}</p>
      <p style="font-size:.82rem">${adapt}</p>
    </div>
    ${recipeCard(r.key)}
    <div class="lesson-nav">
      <button class="btn btn-primary" id="simAgain">${ICON.martini} קוקטייל נוסף</button>
      <button class="btn btn-ghost" id="simHome">חזרה למדף</button>
    </div>`;
  const pb=document.querySelector("#simArea .sim-practice-btn");if(pb)pb.remove();
  document.querySelector("#simArea .recipe-card").addEventListener("click",e=>{
    const tab=e.target.closest(".rc-tab");if(!tab)return;
    const card=tab.closest(".recipe-card");
    card.querySelectorAll(".rc-tab").forEach(t=>t.setAttribute("aria-selected","false"));
    tab.setAttribute("aria-selected","true");
    card.querySelectorAll(".rc-panel").forEach((p,i)=>p.classList.toggle("active",i==tab.dataset.p));
  });
  $("#simAgain").addEventListener("click",startSim);
  $("#simHome").addEventListener("click",renderDash);
}

/* =========================================================
   אתחול
========================================================= */
(async function init(){
  await loadState();
  renderDash();
})();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<script>
/* שכבת אנימציה — עוטפת את הלוגיקה הקיימת בלי לשנות אותה */
(function(){
  const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const AMBER=["#7FE58F","#3FAE5F","#F5F4F2","#BBF7D0"];
  const canFx=!RM&&typeof gsap!=="undefined";
  const canPop=!RM&&typeof confetti!=="undefined";

  function burst(x,y,n){
    if(!canPop)return;
    confetti({particleCount:n||36,spread:65,startVelocity:26,scalar:.8,ticks:120,
      origin:{x,y},colors:AMBER,disableForReducedMotion:true});
  }
  function celebrate(){
    if(!canPop)return;
    const end=Date.now()+900;
    (function frame(){
      confetti({particleCount:5,angle:60,spread:60,origin:{x:0,y:.7},colors:AMBER});
      confetti({particleCount:5,angle:120,spread:60,origin:{x:1,y:.7},colors:AMBER});
      if(Date.now()<end)requestAnimationFrame(frame);
    })();
  }

  /* מעברי מסך קולנועיים */
  if(canFx){
    const _show=show;
    show=function(id){
      _show(id);
      const scr=document.querySelector("#scr-"+id);
      gsap.fromTo(scr,{opacity:0,y:16},{opacity:1,y:0,duration:.4,ease:"power2.out"});
      const kids=scr.querySelectorAll(".hero-banner,.row-head,.hrow,.sim-card,.mod-head,.lesson-item,.q-card,.sim-target,.quiz-head,.recipe-card,.lesson-body");
      if(kids.length)gsap.from(kids,{opacity:0,y:18,duration:.5,stagger:.06,ease:"power2.out",clearProps:"transform,opacity"});
    };
  }

  /* מבחן: קונפטי על תשובה נכונה, רעד על טעות */
  const _answer=answer;
  answer=function(pick){
    const q=MODULES[quiz.mi].quiz[quiz.i],ok=pick===q.a;
    _answer(pick);
    if(ok)burst(.5,.55,30);
    else if(canFx)gsap.fromTo(".q-card",{x:0},{x:9,duration:.055,repeat:5,yoyo:true,ease:"none",clearProps:"x"});
  };

  /* מעבר מבחן = מטח חגיגי */
  const _quizResult=quizResult;
  quizResult=function(){
    const m=MODULES[quiz.mi];
    const pass=Math.round(quiz.correct/m.quiz.length*100)>=80;
    _quizResult();
    if(pass)celebrate();
    if(canFx)gsap.from(".quiz-result .big",{scale:.4,opacity:0,duration:.6,ease:"back.out(2)"});
  };

  /* מסך ביניים ריאליסטי: ניעור/ערבוב/כתישה לפני התוצאה */
  const _simResult=simResult;
  function prepOverlay(cb){
    const tech=(sim.round&&sim.round.tech)||"";
    const shaking=tech.includes("ניעור");
    const ic=shaking?ICON.shaker:tech.includes("כתישה")?ICON.muddler:ICON.stir;
    const txt=shaking?"מנערים היטב...":tech.includes("כתישה")?"כותשים ומרכיבים...":tech.includes("ערבוב")?"מערבבים בעדינות...":"מוזגים...";
    const ov=document.createElement("div");
    ov.className="prep-overlay";
    ov.innerHTML=ic+`<p>${txt}</p>`;
    document.body.appendChild(ov);
    gsap.fromTo(ov,{opacity:0},{opacity:1,duration:.22});
    const svg=ov.querySelector("svg");
    if(shaking)gsap.to(svg,{rotation:14,duration:.09,yoyo:true,repeat:13,transformOrigin:"50% 85%",ease:"none"});
    else if(tech.includes("כתישה"))gsap.to(svg,{y:10,duration:.14,yoyo:true,repeat:8,ease:"power1.inOut"});
    else gsap.to(svg,{rotation:360,duration:1.2,ease:"power1.inOut"});
    setTimeout(()=>{gsap.to(ov,{opacity:0,duration:.3,onComplete:()=>ov.remove()});cb();},1350);
  }
  simResult=function(){
    const perfect=sim.score===5,good=sim.score>=4;
    const finish=()=>{
      _simResult();
      if(perfect)celebrate();else if(good)burst(.5,.4,50);
      if(canFx)gsap.from("#simArea .big",{scale:.4,opacity:0,duration:.6,ease:"back.out(2)"});
    };
    if(canFx)prepOverlay(finish);else finish();
  };

  /* מזיגה: זרם נוזל חי בזמן החזקת הבקבוק */
  document.addEventListener("pointerdown",e=>{
    const h=e.target.closest(".hold-btn");
    if(h&&h.dataset.kind==="hold")h.closest(".pour-row").classList.add("pouring");
  });
  ["pointerup","pointercancel"].forEach(ev=>document.addEventListener(ev,()=>{
    document.querySelectorAll(".pour-row.pouring").forEach(r=>r.classList.remove("pouring"));
  }));

  /* מזיגה מדויקת שנעלה בקבוק — ניצוץ קטן */
  const obs=new MutationObserver(muts=>{
    muts.forEach(m=>{
      if(m.target.classList&&m.target.classList.contains("exact")&&m.attributeName==="class"){
        const r=m.target.getBoundingClientRect();
        burst((r.left+r.width/2)/innerWidth,r.top/innerHeight,22);
      }
    });
  });
  obs.observe(document.body,{attributes:true,subtree:true,attributeFilter:["class"]});
})();
</script>
</body>
</html>
